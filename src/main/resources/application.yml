server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: ngo-library-api
  datasource:
    # Set DB_URL, DB_USERNAME and DB_PASSWORD in the environment (Render dashboard),
    # or locally in config/application.yml (gitignored, see config/application.example.yml).
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 900000
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

app:
  jwt:
    # Set JWT_SECRET (at least 32 characters) in the environment or config/application.yml.
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

  # News and Aadhaar photos live in a private Supabase Storage bucket (created on first start).
  # Set SUPABASE_SECRET_KEY (Supabase dashboard > Settings > API Keys > secret key) on Render.
  storage:
    url: ${SUPABASE_URL:https://eviwctkgjxqqfpserniz.supabase.co}
    key: ${SUPABASE_SECRET_KEY:}
    bucket: photos

  cors:
    # https://localhost = the Android app (Capacitor), http://localhost:8100 = `ionic serve`
    allowed-origins: "http://localhost:4200,http://127.0.0.1:4200,https://rahullibraryshindewadi.vercel.app,https://localhost,http://localhost:8100"

  # Forgot-password codes go out over HTTPS (Render's free plan blocks SMTP): first through the
  # library's Gmail via a Google Apps Script relay (scripts/gmail-relay.gs), else through Brevo.
  # MAIL_FROM must be a sender address verified in Brevo.
  email:
    gmail-relay-url: ${GMAIL_RELAY_URL:}
    gmail-relay-secret: ${GMAIL_RELAY_SECRET:}
    brevo-api-key: ${BREVO_API_KEY:}
    from: ${MAIL_FROM:}
    from-name: राहुल सार्वजनिक वाचनालय

  whatsapp:
    provider: log
    cron: "0 0 9 * * *"
    notification-interval-days: 3
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
    gupshup:
      api-key: ${GUPSHUP_API_KEY:}
      source-number: ${GUPSHUP_SOURCE_NUMBER:}
    custom:
      api-url: ${WHATSAPP_CUSTOM_API_URL:}
      api-key: ${WHATSAPP_CUSTOM_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health